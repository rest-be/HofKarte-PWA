<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HofKarte</title>
  <meta name="description" content="Hofläden in der Nähe finden, verwalten und bewerten." />
  <meta name="theme-color" content="#5a8f3c" />

  <!-- PWA / iOS Home-Screen -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HofKarte" />

  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <div class="lade-hinweis">HofKarte wird geladen …</div>
  </div>

  <script type="module" src="src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .catch((err) => console.error("Service Worker Registrierung fehlgeschlagen:", err));
      });
    }
  </script>
</body>
</html>
