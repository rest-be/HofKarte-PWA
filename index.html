<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HofKarte</title>
  <meta name="description" content="Hofläden in der Nähe finden, verwalten und bewerten." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- Phase 10: Content-Security-Policy. Skripte/Styles nur vom eigenen
       Ursprung (Drittbibliotheken liegen unter vendor/), Bilder von HA
       und OpenStreetMap-Kacheln (https:), Verbindungen nur verschlüsselt
       (http/ws nur für lokale Entwicklung). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'" />

  <!-- PWA / iOS Home-Screen -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HofKarte" />

  <link rel="stylesheet" href="src/styles.css" />
  <link rel="modulepreload" href="src/app.js" />
  <link rel="modulepreload" href="src/ha-client.js" />
  <link rel="modulepreload" href="vendor/home-assistant-js-websocket/index.js" />
</head>
<body>
  <div id="app">
    <div class="lade-hinweis">HofKarte wird geladen …</div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
